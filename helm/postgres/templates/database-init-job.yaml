apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.name" . }}-database-init
  namespace: {{ include "postgres.namespace" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: database-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: {{ .Values.service.port | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret }}
          command:
            - sh
            - -ec
            - |
              until pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"; do
                sleep 2
              done

              for database in {{ range .Values.databases }}{{ . }} {{ end }}; do
                psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
                  --set=database_name="$database" <<'SQL'
              SELECT format('CREATE DATABASE %I', :'database_name')
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = :'database_name'
              )\gexec
              SQL
              done
