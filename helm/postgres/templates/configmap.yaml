apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ include "postgres.namespace" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  01-create-service-databases.sh: |
    #!/usr/bin/env sh
    set -eu

    for database in {{ range .Values.databases }}{{ . }} {{ end }}; do
      psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE ' || quote_ident('$database')
    WHERE NOT EXISTS (
      SELECT FROM pg_database WHERE datname = '$database'
    )\gexec
    SQL
    done
