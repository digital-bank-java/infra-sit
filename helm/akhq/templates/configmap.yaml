apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "akhq.fullname" . }}-config
  namespace: {{ include "akhq.namespace" . }}
  labels:
    {{- include "akhq.labels" . | nindent 4 }}
data:
  application.yml: |
    micronaut:
      security:
        enabled: false
    micronaut.security.token.jwt.signatures.secret.generator.secret: "local-sit-akhq-development-only-secret-do-not-use-in-production"

    akhq:
      connections:
        {{ .Values.kafka.clusterName }}:
          properties:
            bootstrap.servers: {{ .Values.kafka.bootstrapServers | quote }}
