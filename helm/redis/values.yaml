namespaceOverride: ""

image:
  repository: redis
  tag: "7.4-alpine"
  pullPolicy: IfNotPresent

service:
  port: 6379

redis:
  appendOnly: true
  appendFsync: everysec
  maxmemory: "256mb"
  maxmemoryPolicy: noeviction

auth:
  existingSecret: redis
  secretKey: REDIS_PASSWORD

networkPolicy:
  enabled: true
  allowedNamespace: ""
  allowedPodSelector:
    app.kubernetes.io/name: api-gateway

storage:
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
