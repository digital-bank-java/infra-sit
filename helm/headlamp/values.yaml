headlamp:
  namespaceOverride: ""
  fullnameOverride: headlamp

  replicaCount: 1

  config:
    inCluster: true
    inClusterContextName: digital-bank-local
    unsafeUseServiceAccountToken: false
    enableHelm: false
    oidc:
      secret:
        create: false

  service:
    type: ClusterIP
    port: 80

  serviceAccount:
    create: true
    name: headlamp

  clusterRoleBinding:
    create: true
    clusterRoleName: view

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
