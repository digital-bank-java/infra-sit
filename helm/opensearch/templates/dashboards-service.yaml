apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensearch.dashboardsName" . }}
  namespace: {{ include "opensearch.namespace" . }}
  labels:
    {{- include "opensearch.dashboardsLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.dashboards.service.port }}
      targetPort: http
  selector:
    {{- include "opensearch.dashboardsSelectorLabels" . | nindent 4 }}
