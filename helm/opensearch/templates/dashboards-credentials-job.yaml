{{- if .Values.dashboards.credentialsBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opensearch.dashboardsName" . }}-credentials
  namespace: {{ include "opensearch.namespace" . }}
  labels:
    {{- include "opensearch.dashboardsLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "opensearch.dashboardsSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.dashboards.podSecurityContext | nindent 8 }}
      containers:
        - name: configure-kibanaserver
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.dashboards.containerSecurityContext | nindent 12 }}
          env:
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearch.auth.existingSecret is required" .Values.opensearch.auth.existingSecret }}
                  key: {{ required "opensearch.auth.adminPasswordKey is required" .Values.opensearch.auth.adminPasswordKey }}
            - name: OPENSEARCH_DASHBOARDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "dashboards.opensearch.existingSecret is required" .Values.dashboards.opensearch.existingSecret }}
                  key: {{ required "dashboards.opensearch.passwordKey is required" .Values.dashboards.opensearch.passwordKey }}
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              umask 077
              securityadmin=/usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh
              demo_install=/usr/share/opensearch/plugins/opensearch-security/tools/install_demo_configuration.sh
              backup_dir=/tmp/security-backup
              current_users="$backup_dir/internal_users.yml"
              patched_users=/tmp/internal_users-patched.yml
              trap 'rm -rf "$backup_dir" "$patched_users"' EXIT

              test -x "$demo_install"
              "$demo_install" -y -i -s >/tmp/demo-security-setup.log 2>&1

              until curl --fail --silent --show-error --insecure \
                --cert /usr/share/opensearch/config/kirk.pem \
                --key /usr/share/opensearch/config/kirk-key.pem \
                "https://{{ include "opensearch.fullname" . }}:{{ .Values.opensearch.service.httpPort }}/_cluster/health?wait_for_status=yellow&timeout=5s"; do
                sleep 5
              done

              test -x "$securityadmin"
              rm -rf "$backup_dir"
              mkdir -p "$backup_dir"
              "$securityadmin" \
                -h "{{ include "opensearch.fullname" . }}" \
                -p "{{ .Values.opensearch.service.httpPort }}" \
                -backup "$backup_dir" \
                -icl \
                -nhnv \
                -cacert /usr/share/opensearch/config/root-ca.pem \
                -cert /usr/share/opensearch/config/kirk.pem \
                -key /usr/share/opensearch/config/kirk-key.pem

              test -f "$current_users"
              grep -q '^kibanaserver:' "$current_users"
              password_hash="$(/usr/share/opensearch/plugins/opensearch-security/tools/hash.sh -p "$OPENSEARCH_DASHBOARDS_PASSWORD")"

              awk -v replacement="$password_hash" '
                /^kibanaserver:/ { in_kibanaserver = 1 }
                in_kibanaserver && /^[^[:space:]#]/ && !/^kibanaserver:/ { in_kibanaserver = 0 }
                in_kibanaserver && /^[[:space:]]+hash:/ {
                  print substr($0, 1, index($0, "hash:") + 4) " \"" replacement "\""
                  next
                }
                { print }
              ' "$current_users" > "$patched_users"

              "$securityadmin" \
                -h "{{ include "opensearch.fullname" . }}" \
                -p "{{ .Values.opensearch.service.httpPort }}" \
                -f "$patched_users" \
                -t internalusers \
                -icl \
                -nhnv \
                -cacert /usr/share/opensearch/config/root-ca.pem \
                -cert /usr/share/opensearch/config/kirk.pem \
                -key /usr/share/opensearch/config/kirk-key.pem
{{- end }}
