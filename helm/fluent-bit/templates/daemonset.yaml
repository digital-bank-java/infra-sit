apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fluent-bit.fullname" . }}
  namespace: {{ include "fluent-bit.namespace" . }}
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fluent-bit.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "fluent-bit.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fluent-bit.fullname" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 2020
              protocol: TCP
          env:
            - name: OPENSEARCH_HOST
              value: {{ .Values.opensearch.host | quote }}
            - name: OPENSEARCH_PORT
              value: {{ .Values.opensearch.port | quote }}
            - name: OPENSEARCH_TLS
              value: {{ if .Values.opensearch.tls }}"On"{{ else }}"Off"{{ end }}
            - name: OPENSEARCH_TLS_VERIFY
              value: {{ if .Values.opensearch.tlsVerify }}"On"{{ else }}"Off"{{ end }}
            - name: OPENSEARCH_USERNAME
              value: {{ .Values.opensearch.username | quote }}
            - name: OPENSEARCH_INDEX_PREFIX
              value: {{ .Values.opensearch.indexPrefix | quote }}
            - name: OPENSEARCH_BUFFER_LIMIT
              value: {{ .Values.buffer.totalLimitSize | quote }}
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearch.existingSecret is required" .Values.opensearch.existingSecret }}
                  key: {{ required "opensearch.passwordKey is required" .Values.opensearch.passwordKey }}
          command:
            - /fluent-bit/bin/fluent-bit
          args:
            - --config=/fluent-bit/etc/fluent-bit.conf
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/scripts/redact.lua
              subPath: redact.lua
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            {{- if .Values.dockerFallback.enabled }}
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- end }}
            - name: fluent-bit-storage
              mountPath: /var/lib/fluent-bit
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "fluent-bit.fullname" . }}-config
            defaultMode: 0444
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        {{- if .Values.dockerFallback.enabled }}
        - name: docker-containers
          hostPath:
            path: {{ required "dockerFallback.hostPath is required when Docker fallback is enabled" .Values.dockerFallback.hostPath }}
            type: Directory
        {{- end }}
        - name: fluent-bit-storage
          hostPath:
            path: {{ .Values.buffer.storageHostPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
