apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluent-bit.fullname" . }}-config
  namespace: {{ include "fluent-bit.namespace" . }}
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                 1
        Daemon                Off
        Log_Level             info
        Parsers_File          /fluent-bit/etc/parsers.conf
        HTTP_Server           On
        HTTP_Listen           0.0.0.0
        HTTP_PORT             2020
        Health_Check          On
        storage.path          {{ .Values.buffer.storagePath }}
        storage.sync          normal
        storage.checksum      off
        storage.backlog.mem_limit {{ .Values.buffer.backlogMemoryLimit }}
        storage.metrics       on

    [INPUT]
        Name                  tail
        Path                  /var/log/containers/*.log
        Parser                cri
        Tag                   kube.*
        Mem_Buf_Limit         50MB
        Skip_Long_Lines       On
        Refresh_Interval      10
        DB                    {{ .Values.buffer.databasePath }}
        DB.Sync               Normal
        storage.type          filesystem

    {{- if .Values.dockerFallback.enabled }}
    [INPUT]
        Name                  tail
        Path                  /var/lib/docker/containers/*/*-json.log
        Parser                docker
        Tag                   docker.*
        Mem_Buf_Limit         50MB
        Skip_Long_Lines       On
        Refresh_Interval      10
        DB                    {{ .Values.dockerFallback.databasePath }}
        DB.Sync               Normal
        storage.type          filesystem
    {{- end }}

    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Kube_URL              https://kubernetes.default.svc:443
        Kube_CA_File          /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File       /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix       kube.var.log.containers.
        Merge_Log             On
        Merge_Parser          json
        Merge_Log_Key         structured
        Keep_Log              Off
        K8S-Logging.Parser    Off
        K8S-Logging.Exclude   On

    [FILTER]
        Name                  lua
        Match                 kube.*
        script                /fluent-bit/scripts/redact.lua
        call                  process_record
        time_as_table         true

    {{- if .Values.dockerFallback.enabled }}
    [FILTER]
        Name                  lua
        Match                 docker.*
        script                /fluent-bit/scripts/redact.lua
        call                  prepare_docker_record
        time_as_table         true

    [FILTER]
        Name                  parser
        Match                 docker.*
        Key_Name              _docker_raw_log
        Parser                json
        Preserve_Key          Off
        Reserve_Data          On

    [FILTER]
        Name                  lua
        Match                 docker.*
        script                /fluent-bit/scripts/redact.lua
        call                  process_docker_record
        time_as_table         true
    {{- end }}

    [OUTPUT]
        Name                  opensearch
        Match                 kube.*
        Host                  ${OPENSEARCH_HOST}
        Port                  ${OPENSEARCH_PORT}
        HTTP_User             ${OPENSEARCH_USERNAME}
        HTTP_Passwd           ${OPENSEARCH_PASSWORD}
        tls                   ${OPENSEARCH_TLS}
        tls.verify            ${OPENSEARCH_TLS_VERIFY}
        Suppress_Type_Name    On
        Logstash_Format       On
        Logstash_Prefix       ${OPENSEARCH_INDEX_PREFIX}
        Logstash_DateFormat   %Y.%m.%d
        Replace_Dots          On
        Retry_Limit           False
        storage.total_limit_size ${OPENSEARCH_BUFFER_LIMIT}

    {{- if .Values.dockerFallback.enabled }}
    [OUTPUT]
        Name                  opensearch
        Match                 docker.*
        Host                  ${OPENSEARCH_HOST}
        Port                  ${OPENSEARCH_PORT}
        HTTP_User             ${OPENSEARCH_USERNAME}
        HTTP_Passwd           ${OPENSEARCH_PASSWORD}
        tls                   ${OPENSEARCH_TLS}
        tls.verify            ${OPENSEARCH_TLS_VERIFY}
        Suppress_Type_Name    On
        Logstash_Format       On
        Logstash_Prefix       ${OPENSEARCH_INDEX_PREFIX}
        Logstash_DateFormat   %Y.%m.%d
        Replace_Dots          On
        Retry_Limit           False
        storage.total_limit_size ${OPENSEARCH_BUFFER_LIMIT}
    {{- end }}

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name   json
        Format json

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

  redact.lua: |
    local sensitive_fragments = {
      "password", "passwd", "token", "authorization", "secret",
      "apikey", "clientsecret", "accesstoken", "refreshtoken",
      "cookie", "setcookie", "ssn", "nationalid", "taxid"
    }

    local function is_sensitive_key(key)
      local normalized = string.lower(tostring(key))
      normalized = string.gsub(normalized, "_", "")
      normalized = string.gsub(normalized, "%-", "")
      for _, fragment in ipairs(sensitive_fragments) do
        if string.find(normalized, fragment, 1, true) then
          return true
        end
      end
      return false
    end

    local function redact_string(value)
      value = string.gsub(value, "[Bb]earer%s+[^%s]+", "Bearer [REDACTED]")
      value = string.gsub(value, "([Pp]assword%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Tt]oken%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Aa]uthorization%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Ss]ecret%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Aa][Pp][Ii][_][Kk][Ee][Yy]%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Aa][Pp][Ii][Kk][Ee][Yy]%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Cc][Ll][Ii][Ee][Nn][Tt][_][Ss][Ee][Cc][Rr][Ee][Tt]%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      value = string.gsub(value, "([Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc][Rr][Ee][Tt]%s*[:=]%s*)[^%s,;]+", "%1[REDACTED]")
      return value
    end

    local function redact(value)
      if type(value) ~= "table" then
        return value
      end

      for key, child in pairs(value) do
        if is_sensitive_key(key) then
          value[key] = "[REDACTED]"
        elseif type(child) == "table" then
          redact(child)
        elseif type(child) == "string" then
          value[key] = redact_string(child)
        end
      end
      return value
    end

    local docker_metadata_labels = {
      pod_name = "io.kubernetes.pod.name",
      namespace_name = "io.kubernetes.pod.namespace",
      container_name = "io.kubernetes.container.name",
      pod_uid = "io.kubernetes.pod.uid",
      log_path = "io.kubernetes.container.logpath"
    }

    local function escape_pattern(value)
      return string.gsub(value, "([^%w])", "%%%1")
    end

    local function read_docker_label(document, label)
      local key = escape_pattern(label)
      return string.match(document, '"' .. key .. '"%s*:%s*"([^"\\]*)"')
    end

    local function docker_container_id(tag)
      local candidate = string.match(tag or "", "%.([0-9a-fA-F]+)%-json%.log$")
      if candidate ~= nil and string.len(candidate) == 64 then
        return string.lower(candidate)
      end
      return nil
    end

    local function docker_kubernetes_metadata(tag)
      local container_id = docker_container_id(tag)
      if container_id == nil then
        return nil
      end

      local config_path = "/var/lib/docker/containers/" .. container_id .. "/config.v2.json"
      local config_file = io.open(config_path, "r")
      local metadata = { pod_id = container_id }
      if config_file == nil then
        return metadata
      end

      local document = config_file:read("*a")
      config_file:close()
      if document == nil then
        return metadata
      end

      for field, label in pairs(docker_metadata_labels) do
        local value = read_docker_label(document, label)
        if value ~= nil and value ~= "" then
          metadata[field] = value
        end
      end
      return metadata
    end

    local function json_like(value)
      if type(value) ~= "string" then
        return false
      end
      local first_character = string.match(value, "^%s*(.)") or ""
      return first_character == "{" or first_character == "["
    end

    function prepare_docker_record(tag, timestamp, record)
      record["_docker_raw_log"] = record["log"]
      record["log"] = nil
      return 1, timestamp, record
    end

    function process_docker_record(tag, timestamp, record)
      local raw_log = record["_docker_raw_log"]
      record["_docker_raw_log"] = nil
      record["kubernetes"] = docker_kubernetes_metadata(tag)
      record["logging_source"] = "docker-json"

      if raw_log ~= nil then
        if json_like(raw_log) then
          record["logging_parse_status"] = "invalid"
          record["logging_invalid_event"] = true
          record["invalid_event_reason"] = "structured_json_parse_failed"
          record["log"] = "[REDACTED_INVALID_STRUCTURED_LOG]"
        else
          record["logging_parse_status"] = "unstructured"
          record["logging_invalid_event"] = false
          record["log"] = redact_string(raw_log)
        end
      else
        local structured = {}
        for key, value in pairs(record) do
          if key ~= "time" and key ~= "stream" and key ~= "kubernetes" and key ~= "logging_source" then
            structured[key] = value
            record[key] = nil
          end
        end
        record["structured"] = structured
        redact(record)
        record["logging_parse_status"] = "valid"
        record["logging_invalid_event"] = false
      end

      record["logging_agent"] = "fluent-bit"
      return 1, timestamp, record
    end

    function process_record(tag, timestamp, record)
      local parsed = record["structured"]
      if parsed == nil then
        local raw_log = record["log"]
        local first_character = ""
        if type(raw_log) == "string" then
          first_character = string.match(raw_log, "^%s*(.)") or ""
        end

        if first_character == "{" then
          record["logging_parse_status"] = "invalid"
          record["logging_invalid_event"] = true
          record["invalid_event_reason"] = "structured_json_parse_failed"
          record["log"] = "[REDACTED_INVALID_STRUCTURED_LOG]"
        else
          record["logging_parse_status"] = "unstructured"
          record["logging_invalid_event"] = false
          if type(raw_log) == "string" then
            record["log"] = redact_string(raw_log)
          end
        end
      else
        redact(record)
        record["logging_parse_status"] = "valid"
        record["logging_invalid_event"] = false
      end
      record["logging_agent"] = "fluent-bit"
      return 1, timestamp, record
    end
