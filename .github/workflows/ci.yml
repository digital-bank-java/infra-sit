name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  helm-validation:
    name: Helm validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint PostgreSQL chart
        run: helm lint helm/postgres --values helm/postgres/values-sit.yaml

      - name: Render PostgreSQL chart
        run: helm template postgres helm/postgres --values helm/postgres/values-sit.yaml --namespace digital-bank-sit

      - name: Verify PostgreSQL PVC template label stability
        shell: bash
        run: |
          rendered="$(helm template postgres helm/postgres --values helm/postgres/values-sit.yaml --namespace digital-bank-sit)"
          statefulset="$(printf '%s\n' "$rendered" | awk '/# Source: postgres\/templates\/statefulset.yaml/{capture=1; next} capture && /^---$/{exit} capture{print}')"
          pvc_template="$(printf '%s\n' "$statefulset" | sed -n '/  volumeClaimTemplates:/,$p')"

          printf '%s\n' "$pvc_template" | grep -q 'helm.sh/chart: postgres-0.1.0'
          printf '%s\n' "$pvc_template" | grep -q 'app.kubernetes.io/instance: postgres'

      - name: Verify PostgreSQL init password wiring
        shell: bash
        run: |
          rendered="$(helm template postgres helm/postgres --values helm/postgres/values-sit.yaml --namespace digital-bank-sit)"
          database_init="$(printf '%s\n' "$rendered" | awk '/# Source: postgres\/templates\/database-init-job.yaml/{capture=1; next} capture && /^---$/{exit} capture{print}')"

          printf '%s\n' "$database_init" | grep -q 'name: PGPASSWORD'
          printf '%s\n' "$database_init" | grep -q 'key: POSTGRES_PASSWORD'

      - name: Lint Kafka chart
        run: helm lint helm/kafka --values helm/kafka/values-sit.yaml

      - name: Render Kafka chart
        run: helm template kafka helm/kafka --values helm/kafka/values-sit.yaml --namespace digital-bank-sit

      - name: Lint AKHQ chart
        run: helm lint helm/akhq --values helm/akhq/values-sit.yaml

      - name: Render AKHQ chart
        run: helm template akhq helm/akhq --values helm/akhq/values-sit.yaml --namespace digital-bank-tooling

      - name: Lint Redis chart
        run: helm lint helm/redis --values helm/redis/values-sit.yaml

      - name: Render Redis chart
        run: helm template redis helm/redis --values helm/redis/values-sit.yaml --namespace digital-bank-sit
