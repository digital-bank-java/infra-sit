name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  helm-validation:
    name: Helm validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint PostgreSQL chart
        run: helm lint helm/postgres --values helm/postgres/values-sit.yaml

      - name: Render PostgreSQL chart
        run: helm template postgres helm/postgres --values helm/postgres/values-sit.yaml --namespace digital-bank-sit

      - name: Add Headlamp Helm repository
        run: helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/

      - name: Build Headlamp chart dependencies
        run: helm dependency build helm/headlamp

      - name: Lint Headlamp chart
        run: helm lint helm/headlamp --values helm/headlamp/values-sit.yaml

      - name: Render Headlamp chart
        run: helm template headlamp helm/headlamp --values helm/headlamp/values-sit.yaml --namespace digital-bank-tooling
